# alphaflux.net
#
# Two jobs:
#   1. Serve the static marketing site from this image.
#   2. Forward the product paths to the console service on the overlay network.
#
# The proxy block below is the live configuration as it runs in production,
# recovered from the running container on 2026-09-15. It was present in the
# deployed container but missing from this file, which meant rebuilding the
# image would have silently dropped console access at alphaflux.net. Keep the
# two in step: the upstream name is the swarm service name for the console.
#
# Page slugs must never collide with a proxied prefix. The site build refuses
# to compile if one does, because nginx would forward the page instead of
# serving it.

upstream alphaflux_console {
    server alphaflux-login-xsqq9t:8080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    charset utf-8;

    # --- product paths, forwarded to the console --------------------------

    location ^~ /login   { proxy_pass http://alphaflux_console; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location ^~ /console { proxy_pass http://alphaflux_console; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location = /logout   { proxy_pass http://alphaflux_console; proxy_set_header Host $host; }
    location /waitlist   { proxy_pass http://alphaflux_console; proxy_set_header Host $host; }
    location /accept     { proxy_pass http://alphaflux_console; proxy_set_header Host $host; }
    location /admin      { proxy_pass http://alphaflux_console; proxy_set_header Host $host; }
    location ^~ /api     { proxy_pass http://alphaflux_console; proxy_set_header Host $host; }
    location /twilio     { proxy_pass http://alphaflux_console; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location ^~ /scan    { proxy_pass http://alphaflux_console; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location ^~ /patrol  { proxy_pass http://alphaflux_console; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location ^~ /phone   { proxy_pass http://alphaflux_console; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }

    # --- static assets ----------------------------------------------------
    # Content hashed in the filename would allow an immutable cache. These are
    # stable names, so they take a short cache and revalidation instead.

    location ~* \.(js|css|woff2|png|jpg|svg|ico|mjs)$ {
        access_log off;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        try_files $uri =404;
    }

    location = /robots.txt    { add_header Cache-Control "public, max-age=3600"; }
    location = /sitemap.xml   { add_header Cache-Control "public, max-age=3600"; default_type application/xml; }
    # These are read by machines, so the type is set explicitly rather than
    # left to the extension map. charset is a directive, not a parameter, so it
    # takes a space: writing charset=utf-8 here makes nginx read the whole token
    # as an unknown directive and refuse to start.
    location = /llms.txt      { default_type text/plain; charset utf-8; add_header Cache-Control "public, max-age=3600"; }
    location = /llms-full.txt { default_type text/plain; charset utf-8; add_header Cache-Control "public, max-age=3600"; }

    # --- pages ------------------------------------------------------------
    # Clean URLs: /pricing serves pricing.html. The canonical tag on every page
    # points at the extensionless form, so the two never compete in an index.

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/index.html =404;
    }

    # A styled 404 rather than nginx's default page.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
    }
}
